name: Verify release candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novochar-verification-${{ github.sha }}
          path: |
            dist/performance-regression-report.json
            client/dist
          if-no-files-found: warn
